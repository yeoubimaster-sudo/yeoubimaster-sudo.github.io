<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self'; img-src 'self' https://storage.googleapis.com; media-src https://storage.googleapis.com; connect-src https://*.googleapis.com https://*.cloudfunctions.net https://*.run.app https://horizon-4be45.firebaseapp.com; frame-src https://horizon-4be45.firebaseapp.com https://accounts.google.com; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>현장 소식 관리 · 보는날씨</title>
  <link rel="stylesheet" href="./community-admin.css">
  <script type="module" src="./community-admin.js"></script>
</head>
<body id="community-admin-root">
  <header>
    <div class="header-inner">
      <div><a class="back-link" href="./admin.html">← 광고 관리</a><h1>현장 소식 관리</h1></div>
      <div class="account-controls"><span id="accountStatus">로그인 확인 중</span><button id="logoutButton" class="secondary" hidden type="button">로그아웃</button></div>
    </div>
  </header>
  <main>
    <p id="pageStatus" role="status" aria-live="polite">관리자 연결을 확인하고 있어요.</p>
    <div id="errorNotice" class="notice error" role="alert" hidden></div>
    <section id="loginPanel" class="login-panel" hidden aria-labelledby="loginHeading">
      <div class="eyebrow">보는날씨 운영 도구</div>
      <h2 id="loginHeading">관리자 로그인</h2>
      <p>등록된 Google 관리자 계정으로 로그인해 주세요.<br>서버에서 관리 권한을 확인한 뒤 게시물을 표시합니다.</p>
      <button id="loginButton" class="primary" type="button">Google 관리자 로그인</button>
      <button id="verifyButton" class="secondary" type="button" hidden>관리 권한 다시 확인</button>
    </section>
    <section id="workspace" hidden aria-label="현장 소식 검수">
      <div id="featureNotice" class="notice" role="status"></div>
      <div class="workspace-toolbar">
        <div class="view-switch" aria-label="관리 항목">
          <button id="postsTab" type="button" class="selected" aria-pressed="true">게시물 검수</button>
          <button id="reportsTab" type="button" aria-pressed="false">신고 관리</button>
        </div>
        <button id="refreshButton" class="secondary" type="button">새로고침</button>
      </div>
      <div class="list-toolbar">
        <div><h2 id="listHeading">검토 대기 게시물</h2><p id="listStatus" class="muted" role="status" aria-live="polite"></p></div>
        <label id="postFilterField" class="filter-field">게시물 상태
          <select id="postStatus">
            <option value="pending_review">검토 대기 · 비공개</option>
            <option value="processing">파일 처리 중 · 비공개</option>
            <option value="pending_upload">업로드 대기 · 비공개</option>
            <option value="published">공개 중</option>
            <option value="rejected">거절·내림 · 비공개</option>
            <option value="expired">공개 만료</option>
            <option value="failed">파일 처리 실패</option>
            <option value="deleted">삭제됨</option>
          </select>
        </label>
        <label id="reportFilterField" class="filter-field" hidden>신고 상태
          <select id="reportStatus"><option value="open">확인 필요</option><option value="resolved">처리 완료</option></select>
        </label>
      </div>
      <p class="policy-note">접수 기준: 사진 또는 5초 이하 영상 · 설명 150자 · 태그 최대 5개(각 24자) · 공개 기간 1시간 또는 24시간. 유료 자동 검수는 사용하지 않습니다.</p>
      <div id="items" class="items" aria-busy="false"></div>
      <div id="emptyState" class="empty-state" hidden><h3>표시할 항목이 없어요</h3><p>다른 상태를 선택하거나 새로고침해 주세요.</p></div>
      <div class="load-more"><button id="loadMoreButton" class="secondary" type="button" hidden>더 불러오기</button></div>
    </section>
    <noscript><p class="notice error">관리자 도구를 이용하려면 JavaScript를 켜 주세요.</p></noscript>
  </main>
  <dialog id="reviewDialog" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
    <form id="reviewForm">
      <h2 id="dialogTitle"></h2><p id="dialogDescription"></p>
      <label class="reason-field" for="reviewReason">처리 사유 <span id="reasonRequirement"></span></label>
      <textarea id="reviewReason" rows="4" autocomplete="off" placeholder="검토한 내용과 처리 사유를 적어 주세요."></textarea>
      <div class="reason-counter"><span id="reasonCount">0</span> / 300자</div>
      <p id="dialogError" class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="dialogCancel" type="button" class="secondary">취소</button><button id="dialogConfirm" type="submit" class="primary">확인</button></div>
    </form>
  </dialog>
</body>
</html>
