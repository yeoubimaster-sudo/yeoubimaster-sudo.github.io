<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>보는날씨 광고 관리</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5eaf0;
      padding: 18px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 21px;
      margin: 0;
    }

    .sub {
      color: #748094;
      font-size: 13px;
      margin-top: 4px;
    }

    main {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 18px 60px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    .primary {
      background: #172033;
      color: white;
    }

    .approve {
      background: #16874e;
      color: white;
    }

    .revision {
      background: #f0a400;
      color: white;
    }

    .reject {
      background: #d94141;
      color: white;
    }

    .ghost {
      background: #edf1f5;
      color: #344054;
    }

    #loginBox {
      max-width: 520px;
      margin: 100px auto;
      background: white;
      padding: 38px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.06);
    }

    #loginBox h2 {
      margin-top: 0;
    }

    #adminArea {
      display: none;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .filter.active {
      background: #172033;
      color: white;
    }

    #statusText {
      font-size: 13px;
      color: #748094;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.045);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 17px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      background: #eef2f6;
    }

    .pending { background:#fff0c9; }
    .active { background:#dff5e8; }
    .revision_requested { background:#e8e3ff; }
    .rejected { background:#ffe1e1; }
    .available { background:#e7eef7; }
    .expired { background:#ececec; }

    /* 관리자가 게시를 내린 상태. (2026-09-08 추가)
       거절(연빨강)과 헷갈리면 안 되므로 진한 회갈색으로 구분한다. */
    .taken_down { background:#3f3f46; color:#fff; }

    .content-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 22px;
    }

    .creative {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      object-fit: cover;
      background: #eef2f6;
    }

    .info {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 9px 12px;
      font-size: 14px;
    }

    .label {
      color: #7b8494;
    }

    .banner-preview {
      margin-top: 18px;
      border: 1px solid #e5e9ef;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
    }

    .banner-preview img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 12px;
    }

    .banner-title {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .banner-body {
      font-size: 13px;
      color: #697386;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /*
      스토어 거래번호. (2026-09-07 추가)
      광고주가 "애플 영수증 보냅니다" 하고 연락해 왔을 때
      어느 줄에 「신청 링크 재발급」을 눌러야 하는지 맞춰 보는 단서다.
      숫자와 영문이 섞여 있어 고정폭 글꼴로 둔다. 1 과 l 을 눈으로 구분해야 한다.
    */
    .txid {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      word-break: break-all;
      color: #55606f;
    }

    /*
      링크 재발급 버튼. 승인/거절과 헷갈리면 안 되므로
      테두리만 있는 조용한 모양으로 둔다. 자주 누를 버튼이 아니다.
    */
    .reissue {
      background: #fff;
      color: #344054;
      border: 1px solid #cbd3de;
    }

    /*
      「게시 내리기」 버튼. (2026-09-08 추가)

      이미 돈을 받고 나가고 있는 광고를 멈추는 버튼이다.
      거절(.reject, 빨강)보다 더 무거운 동작이라 검정에 가깝게 해서
      다른 버튼과 섞여 실수로 눌리지 않게 한다.
    */
    .takedown {
      background: #1f2937;
      color: #fff;
    }

    /*
      재발급한 주소를 보여주는 상자. (2026-09-08 추가)
      주소가 길어서 한 줄에 안 들어가므로 입력칸에 넣고,
      「복사」와 「열기」를 바로 옆에 둔다.
    */
    .linkbox {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #eef4ff;
      border: 1px solid #c7d7fe;
    }

    .linkbox-title {
      font-size: 13px;
      font-weight: 700;
      color: #1d4ed8;
      margin-bottom: 8px;
    }

    .linkinput {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #c7d7fe;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #fff;
      color: #22303f;
    }

    .linkbox .actions {
      margin-top: 10px;
      align-items: center;
    }

    .copy {
      background: #1d4ed8;
      color: #fff;
    }

    .openlink {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 8px;
      background: #fff;
      color: #1d4ed8;
      border: 1px solid #1d4ed8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .linkhint {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.6;
      color: #475467;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      color: #7b8494;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    /*
      내가 왜 수정요청/거절을 했는지 적어둔 사유를 카드 안에 보여준다.
      (2026-09-07 추가. 그전에는 사유를 적어놓고도 볼 방법이 없었다)
    */
    .reason {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .reason .reason-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 4px;
      opacity: 0.75;
    }

    /*
      이름을 reason-revision / reason-reject 로 따로 쓴다.
      .revision 은 이미 「수정요청」 버튼이, .rejected 는 배지가 쓰고 있어서
      그대로 쓰면 나중에 색을 바꿀 때 엉뚱한 곳이 같이 바뀐다.
    */

    /* 수정요청 = 보라색 (배지 색과 맞춤) */
    .reason-revision {
      background: #f3f0ff;
      color: #4c3d9e;
    }

    /* 거절 = 빨간색 */
    .reason-reject {
      background: #fff0f0;
      color: #b42318;
    }

    /* 게시중단 = 진회색 (2026-09-08 추가) */
    .reason-takedown {
      background: #eceef1;
      color: #1f2937;
    }

    @media(max-width:700px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .creative {
        max-width: 260px;
      }

      .info {
        grid-template-columns: 105px 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <h1>보는날씨 광고 관리</h1>
      <div class="sub">광고·홍보 신청 심사 및 게시 관리</div>
    </div>

    <div id="accountArea" style="display:none;">
      <span id="adminEmail" class="sub"></span>
      <button id="logoutButton" class="ghost">로그아웃</button>
    </div>
  </div>
</header>

<main>

  <section id="loginBox">
    <h2>관리자 로그인</h2>
    <p class="sub">
      등록된 보는날씨 관리자 Google 계정만 접속할 수 있습니다.
    </p>

    <button id="loginButton" class="primary">
      Google 계정으로 로그인
    </button>
  </section>

  <section id="adminArea">

    <div id="errorBox"></div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter active" data-status="all">전체</button>
        <button class="filter" data-status="pending">심사대기</button>
        <button class="filter" data-status="revision_requested">수정요청</button>
        <button class="filter" data-status="active">게시중</button>
        <button class="filter" data-status="rejected">거절</button>
        <button class="filter" data-status="taken_down">게시중단</button>
      </div>

      <div>
        <span id="statusText"></span>
        <button id="refreshButton" class="ghost">새로고침</button>
      </div>
    </div>

    <div id="list"></div>

  </section>

</main>

<script type="module">
  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  import {
    getFunctions,
    httpsCallable
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";

  const ADMIN_EMAIL = "yeoubi.master@gmail.com";

  const firebaseConfig = {
    apiKey: "AIzaSyB42uqx7kLei3dE3uLZBUNQgP_uLAzuFkQ",
    authDomain: "horizon-4be45.firebaseapp.com",
    projectId: "horizon-4be45",
    storageBucket: "horizon-4be45.firebasestorage.app",
    messagingSenderId: "955109054720",
    appId: "1:955109054720:web:2b155899d4e14efa377be5",
    measurementId: "G-HD1CMEL7CN"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const functions = getFunctions(app, "asia-northeast3");

  const listApplications =
    httpsCallable(functions, "listAdApplications");

  const approveAd =
    httpsCallable(functions, "approveAd");

  const requestRevision =
    httpsCallable(functions, "requestAdRevision");

  const rejectAd =
    httpsCallable(functions, "rejectAd");

  // 이미 게시된 광고를 내린다. (2026-09-08 추가)
  const takeDownAd =
    httpsCallable(functions, "takeDownAd");

  // 앱을 지운 광고주에게 보내줄 신청 링크를 새로 뽑는다. (2026-09-07 추가)
  const reissueLink =
    httpsCallable(functions, "reissueAdApplicationLink");

  const loginBox = document.getElementById("loginBox");
  const adminArea = document.getElementById("adminArea");
  const accountArea = document.getElementById("accountArea");
  const adminEmail = document.getElementById("adminEmail");
  const list = document.getElementById("list");
  const errorBox = document.getElementById("errorBox");
  const statusText = document.getElementById("statusText");

  let applications = [];
  let currentFilter = "all";

  // 방금 재발급한 주소를 화면에 남겨둔다. (2026-09-08 추가)
  //
  // 왜 이렇게 바꿨나.
  //   처음에는 alert / prompt 창으로 주소를 보여줬는데, 크롬은
  //   confirm 창이 닫힌 직후 클립보드 쓰기를 막는다("Document is not
  //   focused"). 그래서 매번 prompt 로 떨어졌고, prompt 안의 긴 주소는
  //   손으로 긁어 복사하기가 사실상 불가능했다.
  //   이제는 카드 안에 주소칸 + 복사 + 열기 버튼으로 그려준다.
  //
  //   페이지를 새로고침하면 사라진다. 주소 자체는 서버에 남아 있으니
  //   문제 없고, 오히려 화면에 오래 떠 있지 않는 편이 안전하다.
  const reissuedLinks = {};

  const productNames = {
    "com.yeoubi.bonunnalssi2.ad.region7d": "지역 광고 · 7일",
    "com.yeoubi.bonunnalssi2.ad.region15d": "지역 광고 · 15일",
    "com.yeoubi.bonunnalssi2.ad.region30d": "지역 광고 · 30일",
    "com.yeoubi.bonunnalssi2.ad.national7d": "전국 광고 · 7일",
    "com.yeoubi.bonunnalssi2.ad.national15d": "전국 광고 · 15일",
    "com.yeoubi.bonunnalssi2.ad.national30d": "전국 광고 · 30일"
  };

  const statusNames = {
    available: "신청 전",
    pending: "심사대기",
    revision_requested: "수정요청",
    rejected: "거절",
    active: "게시중",
    expired: "게시종료",

    // 관리자가 게시를 내린 상태. (2026-09-08 추가)
    // 광고주가 고쳐서 다시 낼 수 있는 상태다. 「끝」이 아니다.
    taken_down: "게시중단"
  };

  function esc(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatDate(ms) {
    if (!ms) return "-";

    return new Intl.DateTimeFormat("ko-KR", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }).format(new Date(ms));
  }

  function regionName(key) {
    if (!key) return "-";
    if (key === "_national") return "전국";

    const index = key.indexOf("_");

    if (index < 0) return key;

    return (
      key.slice(0, index) +
      " " +
      key.slice(index + 1)
    );
  }

  function showError(message) {
    errorBox.innerHTML =
      `<div class="error">${esc(message)}</div>`;
  }

  function clearError() {
    errorBox.innerHTML = "";
  }

  async function loadApplications() {
    clearError();
    statusText.textContent = "불러오는 중...";

    try {
      const result = await listApplications({});
      applications = result.data.applications || [];

      statusText.textContent =
        `총 ${applications.length}건`;

      render();
    } catch (error) {
      console.error(error);

      showError(
        error.message ||
        "광고 신청 목록을 불러오지 못했습니다."
      );

      statusText.textContent = "";
    }
  }

  function render() {
    const rows = applications.filter(item =>
      currentFilter === "all" ||
      item.reviewStatus === currentFilter
    );

    if (!rows.length) {
      list.innerHTML =
        '<div class="empty">해당 광고 신청이 없습니다.</div>';
      return;
    }

    list.innerHTML = rows.map(item => {
      const status =
        statusNames[item.reviewStatus] ||
        item.reviewStatus ||
        "-";

      const product =
        productNames[item.productId] ||
        item.productId ||
        "-";

      // 수정요청 / 거절을 하면서 내가 적어둔 사유를 카드에 보여준다.
      // (2026-09-07 추가. 그전에는 적어놓고도 볼 방법이 없었다)
      //
      // 상태로 고르지 않고 "값이 있으면 보여준다"로 한 이유:
      // 수정요청 → 광고주가 다시 제출 → 상태는 pending 이 되지만
      // 내가 뭐라고 요청했는지는 그때 오히려 더 봐야 한다.
      let reasonBox = "";

      if (item.revisionReason) {
        reasonBox += `
          <div class="reason reason-revision">
            <span class="reason-label">수정요청 사유</span>
            ${esc(item.revisionReason)}
          </div>
        `;
      }

      if (item.rejectReason) {
        reasonBox += `
          <div class="reason reason-reject">
            <span class="reason-label">거절 사유</span>
            ${esc(item.rejectReason)}
          </div>
        `;
      }

      // 게시를 내린 이유. (2026-09-08 추가)
      // 나중에 "이거 왜 내렸더라"를 반드시 볼 수 있어야 한다.
      if (item.takenDownReason) {
        reasonBox += `
          <div class="reason reason-takedown">
            <span class="reason-label">게시중단 사유</span>
            ${esc(item.takenDownReason)}
          </div>
        `;
      }

      const actions =
        item.reviewStatus === "pending"
          ? `
            <div class="actions">
              <button class="approve"
                data-action="approve"
                data-id="${esc(item.orderId)}">
                승인 · 바로 게시
              </button>

              <button class="revision"
                data-action="revision"
                data-id="${esc(item.orderId)}">
                수정요청
              </button>

              <button class="reject"
                data-action="reject"
                data-id="${esc(item.orderId)}">
                거절
              </button>
            </div>
          `
          : "";

      // ── 「게시 내리기」 버튼 (2026-09-08 추가) ────────────────
      //
      // 이미 앱에 나가고 있는 광고를 멈추는 버튼이다.
      // 게시중(active)일 때만 나온다. 서버도 같은 조건으로 막는다.
      // (ad_system.js takeDownAd: reviewStatus !== "active" 면 거부)
      const takeDownBox =
        item.reviewStatus === "active"
          ? `
            <div class="actions">
              <button class="takedown"
                data-action="takedown"
                data-id="${esc(item.orderId)}">
                게시 내리기
              </button>
            </div>
          `
          : "";

      // ── 신청 링크 재발급 버튼 (2026-09-07 추가) ──────────────
      //
      // 광고주가 앱을 지우면 게시권을 영영 못 쓴다. 이 버튼이 유일한 구제책이다.
      // 링크를 새로 뽑아서 문자로 보내주면 앱 없이도 신청서를 쓸 수 있다.
      //
      // 여기 목록은 서버 reissueAdApplicationLink 의 reissuable 과 **같아야 한다.**
      // 여기만 넓히면 눌러도 서버가 거부하는 버튼이 된다.
      const canReissue = [
        "available",
        "revision_requested",
        "rejected",
        // 게시를 내린 뒤 광고주가 고쳐서 다시 내려면 링크가 필요하다.
        // (2026-09-08 추가. 서버 reissuable 에도 같이 넣었다)
        "taken_down",
      ].includes(item.reviewStatus);

      const reissueBox = canReissue
        ? `
          <div class="actions">
            <button class="reissue"
              data-action="reissue"
              data-id="${esc(item.orderId)}">
              신청 링크 재발급
            </button>
          </div>
        `
        : "";

      // ── 방금 뽑은 주소를 카드 안에 보여준다 (2026-09-08 추가) ──
      //
      // alert / prompt 로는 긴 주소를 복사할 수가 없었다. 그래서
      // 읽기전용 입력칸에 넣어두고 「복사」와 「열기」를 붙였다.
      // 「복사」는 사용자가 직접 누르는 순간에 실행되므로 크롬이 막지 않는다.
      const freshLink = reissuedLinks[item.orderId] || "";

      const linkBox = freshLink
        ? `
          <div class="linkbox">
            <div class="linkbox-title">새 신청 링크</div>
            <input class="linkinput"
              type="text"
              readonly
              data-owner="${esc(item.orderId)}"
              value="${esc(freshLink)}">
            <div class="actions">
              <button class="copy"
                data-action="copy"
                data-id="${esc(item.orderId)}">
                복사
              </button>
              <a class="openlink"
                href="${esc(freshLink)}"
                target="_blank"
                rel="noopener">
                열기
              </a>
            </div>
            <div class="linkhint">
              ⚠️ 이 주소는 비밀번호와 같습니다.
              본인이 맞는지 확인한 뒤 그 사람에게만 보내주세요.<br>
              ⚠️ 재발급을 또 누르면 이 주소는 그 즉시 못 쓰게 됩니다.
            </div>
          </div>
        `
        : "";

      return `
        <article class="card">

          <div class="card-top">
            <div>
              <span class="badge ${esc(item.reviewStatus)}">
                ${esc(status)}
              </span>

              <strong style="margin-left:8px;">
                ${esc(product)}
              </strong>
            </div>

            <div class="sub">
              신청 ${formatDate(item.submittedAt)}
            </div>
          </div>

          <div class="content-grid">

            <div>
              ${
                item.imageUrl
                  ? `<img class="creative"
                       src="${esc(item.imageUrl)}"
                       alt="광고 이미지">`
                  : `<div class="creative"></div>`
              }
            </div>

            <div>

              <div class="info">
                <div class="label">광고지역</div>
                <div>${esc(regionName(item.regionKey))}</div>

                <div class="label">큰 문구</div>
                <div>${esc(item.title)}</div>

                <div class="label">작은 문구</div>
                <div>${esc(item.body || "-")}</div>

                <div class="label">연결주소</div>
                <div>${esc(item.linkUrl || "-")}</div>

                <div class="label">버튼 문구</div>
                <div>${esc(item.ctaLabel || "보기")}</div>

                <div class="label">신청자</div>
                <div>${esc(item.contactName)}</div>

                <div class="label">연락처</div>
                <div>${esc(item.contactPhone)}</div>

                <div class="label">게시 시작</div>
                <div>${formatDate(item.startAt)}</div>

                <div class="label">게시 종료</div>
                <div>${formatDate(item.endAt)}</div>

                <div class="label">거래번호</div>
                <div class="txid">${esc(item.transactionId || "-")}</div>
              </div>

              <div class="banner-preview">
                ${
                  item.imageUrl
                    ? `<img src="${esc(item.imageUrl)}">`
                    : ""
                }

                <div>
                  <div class="banner-title">
                    ${esc(item.title || "큰 문구")}
                  </div>

                  <div class="banner-body">
                    ${esc(item.body || "작은 문구")}
                  </div>
                </div>
              </div>

              ${reasonBox}

              ${actions}

              ${takeDownBox}

              ${reissueBox}

              ${linkBox}

            </div>
          </div>

        </article>
      `;
    }).join("");
  }

  async function handleAction(action, orderId) {
    clearError();

    try {
      if (action === "approve") {
        const ok = confirm(
          "승인 즉시 광고가 게시되고 구매한 기간이 시작됩니다.\n\n정말 승인하시겠습니까?"
        );

        if (!ok) return;

        await approveAd({ orderId });
      }

      if (action === "revision") {
        const reason = prompt(
          "광고주에게 전달할 수정 내용을 입력하세요."
        );

        if (!reason) return;

        await requestRevision({
          orderId,
          reason
        });
      }

      // ── 신청 링크 재발급 (2026-09-07 추가) ──────────────────
      //
      // 광고주가 앱을 지워서 게시권을 못 쓸 때 쓴다.
      // 여기서 나온 주소를 문자로 보내주면 앱 없이 신청서를 쓸 수 있다.
      if (action === "reissue") {
        const ok = confirm(
          "이 주문의 신청 링크를 새로 만듭니다.\n\n" +
          "⚠️ 광고주가 전에 받은 링크는 이 순간부터 못 씁니다.\n" +
          "⚠️ 이 주소를 아는 사람은 누구나 이 주문의 신청서를 쓸 수 있습니다.\n" +
          "   본인이 맞는지 확인한 뒤 그 사람에게만 보내주세요.\n\n" +
          "계속할까요?"
        );

        if (!ok) return;

        const res = await reissueLink({ orderId });
        const url = (res && res.data && res.data.url) || "";

        if (!url) {
          throw new Error("링크를 받지 못했습니다.");
        }

        // 여기서 바로 복사하지 않는다. (2026-09-08 변경)
        // 크롬은 confirm 창이 닫힌 직후의 클립보드 쓰기를 막는다.
        // 대신 주소를 기억해 두고 카드 안에 그려주면, 「복사」 버튼을
        // 누르는 그 순간이 정상적인 사용자 동작이라 항상 성공한다.
        reissuedLinks[orderId] = url;
      }

      // ── 카드 안의 「복사」 버튼 (2026-09-08 추가) ────────────
      if (action === "copy") {
        const input = list.querySelector(
          `.linkinput[data-owner="${orderId}"]`
        );

        if (!input) {
          throw new Error("복사할 주소를 찾지 못했습니다.");
        }

        // 먼저 눈에 보이게 선택해 준다. 복사가 실패해도
        // 이미 선택돼 있으니 Cmd+C 로 바로 복사할 수 있다.
        input.focus();
        input.select();
        input.setSelectionRange(0, input.value.length);

        let copied = false;

        try {
          await navigator.clipboard.writeText(input.value);
          copied = true;
        } catch (e) {
          console.warn("클립보드 API 실패, 옛 방식으로 시도", e);

          try {
            copied = document.execCommand("copy");
          } catch (e2) {
            console.warn("옛 방식도 실패", e2);
          }
        }

        statusText.textContent = copied ?
          "주소를 복사했습니다. 광고주에게 붙여넣어 보내주세요." :
          "복사가 안 됩니다. 주소가 선택돼 있으니 Cmd+C 를 눌러주세요.";

        // 목록을 다시 불러오면 선택이 풀리므로 여기서 끝낸다.
        return;
      }

      // ── 게시 내리기 (2026-09-08 추가) ──────────────────────
      //
      // 이미 앱에 나가고 있는 광고를 멈춘다.
      // 광고주가 돈을 낸 거래라 확인창을 두 번 띄운다.
      //   ① 사유 입력 (사유 없이는 못 내린다. 서버도 거부한다)
      //   ② 마지막 확인
      if (action === "takedown") {
        const reason = prompt(
          "게시를 내리는 사유를 입력하세요.\n" +
          "광고주 폰으로 이 내용이 그대로 갑니다."
        );

        if (!reason) return;

        const ok = confirm(
          "이 광고를 지금 즉시 앱에서 내립니다.\n\n" +
          "· 광고주에게 알림이 갑니다.\n" +
          "· 그 지역 광고 자리는 바로 비워집니다.\n" +
          "· 광고주는 내용을 고쳐 다시 낼 수 있습니다.\n" +
          "  (「신청 링크 재발급」을 눌러 링크를 보내주세요)\n" +
          "· 다시 승인하면 게시 기간이 그 시점부터 새로 계산됩니다.\n" +
          "  즉 이미 나갔던 날짜만큼 광고주가 이득을 봅니다.\n\n" +
          "계속할까요?"
        );

        if (!ok) return;

        const res = await takeDownAd({ orderId, reason });

        // 목록을 **먼저** 새로 불러온다.
        // loadApplications 안에서 clearError() 가 돌기 때문에,
        // 경고를 먼저 띄우면 그 자리에서 지워져 버린다.
        await loadApplications();

        // 서버가 ads 문서에서 해당 칸을 못 찾은 경우.
        // 신청서 상태는 바뀌었지만 앱에는 아직 보일 수 있다.
        // 조용히 넘기면 "내렸는데 왜 계속 보이지"가 된다.
        if (res && res.data && res.data.removedFromAds === false) {
          showError(
            "신청서 상태는 「게시중단」으로 바꿨지만, 광고 목록에서 " +
            "해당 항목을 찾지 못했습니다. 앱에 아직 보일 수 있으니 " +
            "Firebase 콘솔의 ads 문서를 직접 확인해주세요."
          );
        } else {
          statusText.textContent = "게시를 내렸습니다.";
        }

        // 아래 공통 loadApplications 를 또 돌지 않도록 여기서 끝낸다.
        return;
      }

      if (action === "reject") {
        const reason = prompt(
          "거절 사유를 입력하세요.\n게시권은 다시 사용할 수 있습니다."
        );

        if (!reason) return;

        const ok = confirm(
          "이 신청을 거절하시겠습니까?\n게시권은 소모되지 않습니다."
        );

        if (!ok) return;

        await rejectAd({
          orderId,
          reason
        });
      }

      await loadApplications();

    } catch (error) {
      console.error(error);

      showError(
        error.message ||
        "처리 중 오류가 발생했습니다."
      );
    }
  }

  list.addEventListener("click", event => {
    const button =
      event.target.closest("button[data-action]");

    if (!button) return;

    handleAction(
      button.dataset.action,
      button.dataset.id
    );
  });

  document.querySelectorAll(".filter")
    .forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter")
          .forEach(x => x.classList.remove("active"));

        button.classList.add("active");
        currentFilter = button.dataset.status;
        render();
      });
    });

  document.getElementById("refreshButton")
    .addEventListener("click", loadApplications);

  document.getElementById("loginButton")
    .addEventListener("click", async () => {
      clearError();

      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({
          prompt: "select_account"
        });

        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error(error);
        showError(error.message || "로그인에 실패했습니다.");
      }
    });

  document.getElementById("logoutButton")
    .addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, async user => {

    if (!user) {
      loginBox.style.display = "block";
      adminArea.style.display = "none";
      accountArea.style.display = "none";
      return;
    }

    if (
      !user.emailVerified ||
      user.email?.toLowerCase() !== ADMIN_EMAIL
    ) {
      await signOut(auth);

      alert(
        "등록된 보는날씨 관리자 계정만 접속할 수 있습니다."
      );

      return;
    }

    loginBox.style.display = "none";
    adminArea.style.display = "block";
    accountArea.style.display = "block";

    adminEmail.textContent = user.email;

    await loadApplications();
  });
</script>

</body>
</html>
