<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>보는날씨 다운로드</title>
<meta name="description" content="눈으로 확인하는 현장 날씨, 보는날씨를 다운로드하세요.">
<style>
*{box-sizing:border-box}body{margin:0;background:#edf8ff;color:#153247;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:440px;background:white;border-radius:28px;padding:36px 28px;text-align:center;box-shadow:0 12px 50px #1532470c}img{width:200px;max-width:80%;height:auto}h1{font-size:27px;line-height:1.4;margin:16px 0}p{line-height:1.7;color:#53687b}.button{display:block;text-decoration:none;background:#079ee2;color:white;padding:18px;border-radius:14px;font-weight:700;margin:24px 0 14px}footer{margin-top:26px}footer a{color:#53687b;font-size:14px}#status{font-size:15px}a:focus-visible{outline:3px solid #ff9d00;outline-offset:4px}
</style>
</head>
<body><main>
<img src="logo.png" alt="보는날씨" width="1024" height="1024">
<h1>눈으로 확인하는<br>현장 날씨</h1>
<p id="status" role="status">보는날씨로 지금 날씨를 확인하세요.</p>
<a class="button" id="ios-link" href="https://apps.apple.com/kr/app/id6762339060">iPhone · App Store 다운로드</a>
<a class="button" id="android-link" href="https://play.google.com/store/apps/details?id=com.yeoubi.bonunnalssi2">Android · Google Play 다운로드</a>
<footer><a href="/">보는날씨 홈페이지</a></footer>
</main><script>
// 기존 QR 주소는 유지하고 기기에 맞는 공식 스토어로 이동합니다.
const ANDROID_STORE_URL = 'https://play.google.com/store/apps/details?id=com.yeoubi.bonunnalssi2';
const IOS_STORE_URL = 'https://apps.apple.com/kr/app/id6762339060';
const ua = navigator.userAgent || '';
const isAndroid = /Android/i.test(ua);
const isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
const status = document.getElementById('status');
if (isIOS) {
 status.textContent='App Store로 이동합니다. 열리지 않으면 아래 버튼을 눌러주세요.';
 window.location.replace(IOS_STORE_URL);
} else if (isAndroid) {
 status.textContent='Google Play로 이동합니다. 열리지 않으면 아래 버튼을 눌러주세요.';
 window.location.replace(ANDROID_STORE_URL);
}
</script></body></html>
